<!doctype html><html><head><title>Backend Engineer - Acme</title></head><body>
<h1>Backend Engineer (Python)</h1>
<form id="application-form" action="thanks.html" method="get">
  <div class="field"><label for="first_name">First Name *</label><input id="first_name" name="first_name" required></div>
  <div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="last_name" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
  <div class="field"><label for="resume">Resume/CV *</label><input id="resume" name="resume" type="file" required></div>
  <div class="field"><label for="q1">LinkedIn Profile</label><input id="q1" name="q1"></div>
  <div class="field"><label for="q2">GitHub URL</label><input id="q2" name="q2"></div>
  <div class="field"><label for="q3">Website</label><input id="q3" name="q3"></div>
  <div class="field"><label for="q4">Are you legally authorized to work in the country you'd be working in? *</label><input id="q4" name="q4" required></div>
  <div class="field"><label for="q5">What are your salary expectations?</label><input id="q5" name="q5"></div>
  <div class="field"><label for="q6">Tell us about a production incident you fixed. *</label><textarea id="q6" name="q6" required></textarea></div>
  <div class="field"><label for="q7">How did you hear about this job?</label><input id="q7" name="q7"></div>
  <div class="field"><label><input type="checkbox" name="consent" required> I agree to the privacy policy</label></div>
  <button type="submit" id="submit">Submit application</button>
</form></body></html>
