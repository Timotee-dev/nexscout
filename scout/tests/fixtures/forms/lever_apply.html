<!doctype html><html><body>
<form action="thanks.html">
  <ul>
   <li><label>Resume/CV <input type="file" name="resume" style="opacity:0;position:absolute;width:1px;height:1px"></label></li>
   <li><div class="application-label">Full name</div><div><input type="text" name="name"></div></li>
   <li><div class="application-label">Email</div><div><input type="email" name="email"></div></li>
   <li><div class="application-label">Phone</div><div><input type="text" name="phone"></div></li>
   <li><div class="application-label">Current company</div><div><input type="text" name="org"></div></li>
   <li><div class="application-label">GitHub URL</div><div><input type="text" name="urls[GitHub]"></div></li>
   <li><div class="application-label">Portfolio URL</div><div><input type="text" name="urls[Portfolio]"></div></li>
   <li><div class="application-label">Additional information</div><div><textarea name="comments"></textarea></div></li>
   <li><div class="application-label">Will you now or in the future require visa sponsorship?</div><div><select name="sponsor"><option></option><option>Yes</option><option>No</option></select></div></li>
  </ul>
  <button type="submit">Submit application</button>
</form></body></html>
